/* NOTES */
const NOTES=[
["Ch 6","Decision-making",`<p>Control statements steer the flow of execution based on conditions: <b>if, if-else, nested-if, if-else-if</b>, <b>switch-case</b>, and jump statements (<code>break, continue, return</code>).</p>
<ul><li><b>if</b>: runs a block only when the condition is true.</li><li><b>if-else</b>: the else block runs when the condition is false.</li><li><b>nested if</b>: an if inside another if or else.</li><li><b>if-else-if ladder</b>: checked top-down; the first true condition runs and the rest are skipped. Many <code>else if</code> are allowed, only one final <code>else</code>.</li></ul>`+P(`int number = 10;
if (number > 0) {
    System.out.println("Positive");
} else if (number < 0) {
    System.out.println("Negative");
} else {
    System.out.println("Zero");
}`)],
["Ch 6","Switch-case",`<p>A multiway branch that replaces long if-else chains. Allowed switch types: <code>byte, short, int, char</code> (and wrappers), <code>enum</code> (Java 5), <code>String</code> (Java 7). Case values must match the switch type.</p>
<ul><li><code>break</code> exits the switch. Without it, execution <b>falls through</b> into the next cases.</li><li>Group cases by leaving out break between them.</li><li><code>default</code> runs when no case matches.</li></ul>`+P(`switch (animal) {
    case "DOG":
    case "CAT":
        System.out.println("Pet"); break;
    default:
        System.out.println("Unknown");
}`)],
["Ch 6","Jump statements",`<ul><li><b>break</b>: ends the nearest loop or switch; control moves to the statement after it.</li><li><b>continue</b>: skips the rest of the current iteration and goes to the next loop check.</li><li><b>return</b>: leaves the method, with or without a value. It is a reserved word.</li></ul>`+P(`for (int i = 1; i <= 10; i++) {
    if (i == 6) break;      // prints 1 to 5
}
for (int i = 1; i <= 10; i++) {
    if (i == 6) continue;   // skips only 6
    System.out.print(i + " ");
}`)],
["Ch 6","Loops: for, while, do-while",`<ul><li><b>for</b>: use when the number of repeats is known. Parts: initialization, testing condition, body, update. Entry-controlled (checks first).</li><li><b>while</b>: entry-controlled. Test, run body, update, repeat until false.</li><li><b>do-while</b>: exit-controlled. The body runs <b>at least once</b>, then the condition is checked. Good for menus.</li></ul>`+P(`for (int i = 1; i <= 10; i++) { ... }

int i = 1;
while (i <= 5) { sum += i; i++; }

int c = 1;
do { System.out.println("Hello"); c++; } while (c < 6);  // 5 times`)+`<p class="mut">Tracing tip: write the loop variable, the condition result (true/false) and the output for every pass, until the condition turns false.</p>`],
["Ch 7","Type casting overview",`<p>Type casting is converting one data type into another. Java has two kinds: <b>widening</b> (implicit) and <b>narrowing</b> (explicit).</p>
<div class="tw"><table><tr><th></th><th>Widening</th><th>Narrowing</th></tr><tr><td>Also called</td><td>Implicit casting</td><td>Explicit casting</td></tr><tr><td>Direction</td><td>Smaller to larger type</td><td>Larger to smaller type</td></tr><tr><td>Automatic?</td><td>Yes</td><td>No, needs a cast operator</td></tr><tr><td>Data loss?</td><td>No, safe</td><td>Possible, unsafe</td></tr><tr><td>Without cast</td><td>Works</td><td>Compile-time error</td></tr></table></div>`+P(`byte -> short -> int -> long -> float -> double
           char -> int`)+`<p class="mut">The "casting up/down" names are used inconsistently across sources, so rely on implicit vs explicit.</p>`],
["Ch 7","Widening (implicit) casting",`<p>A lower (smaller) type is converted to a higher (larger) type. Java does it automatically because no data can be lost.</p>
<p>It happens when: the target type is larger than the source type, and both types are compatible with each other.</p>`+P(`int i = 100;
long l = i;          // int -> long
float f = l;         // long -> float
double d = f;        // float -> double
double d2 = 5;       // 5.0
char c = 'A';
int code = c;        // 65 (char -> int)
System.out.println(d2 + " " + code);   // 5.0 65`)],
["Ch 7","Narrowing (explicit) casting",`<p>A bigger type is downsized into a smaller one. It does not happen by itself: without a cast you get a <b>compile-time error</b>. It is unsafe because the smaller type has a smaller range, so data can be lost. You use the <b>cast operator</b> <code>(type)</code>.</p>
<ul><li>double to int <b>truncates</b> the decimals (it does not round).</li><li>A value too big for the target type overflows and wraps around.</li></ul>`+P(`int bad = 9.7;             // compile error
int x = (int) 9.7;         // 9 (decimals cut off)
int y = (int) 7.9;         // 7, not 8
byte b = (byte) 130;       // -126 (overflow)
double d = 9.7;
int z = (int) d + 1;       // 10
int r = 5 / 2;             // 2 (integer division)
double q = 5 / 2.0;        // 2.5`)],
["Ch 7","Parsing vs casting",`<p><b>Casting</b> converts between compatible types (<code>(int) 9.7</code>). <b>Parsing</b> turns a String into a primitive (<code>Integer.parseInt("123")</code>) and throws <code>NumberFormatException</code> when the text is not a valid number.</p>`],
["Ch 7","String charAt()",`<p><code>s.charAt(index)</code> returns the char at that position. Index starts at 0 and must be from 0 to <code>length() - 1</code>; otherwise <code>StringIndexOutOfBoundsException</code>.</p>`+P(`String s = "banana";
s.charAt(0);              // 'b'
s.charAt(s.length() - 1); // 'a'
int count = 0;
for (int i = 0; i < s.length(); i++)
    if (s.charAt(i) == 'a') count++;   // 3`)],
["Ch 8","Arrays basics",`<ul><li>Stores many values of one type; zero-based; <b>fixed length</b> once created; size from the <code>length</code> property (no parentheses).</li><li>Arrays are objects, allocated on the heap.</li><li>Defaults after <code>new</code>: 0 for numbers, false for boolean, null for references.</li><li>Prefer <code>int[] arr</code> over <code>int arr[]</code>.</li><li>Illegal index gives <code>ArrayIndexOutOfBoundsException</code>.</li></ul>`+P(`int[] a = {10, 20, 30, 40};
a[1] = 25;
for (int i = 0; i < a.length; i++)
    System.out.println(a[i]);`)],
["Ch 8","Three ways to initialize",`<ul><li><b>Shorthand</b> (only at declaration): <code>int[] a = {1, 2, 3};</code></li><li><b>Explicit new</b> (anywhere): <code>a = new int[]{4, 5, 6};</code></li><li><b>Element by element</b> (size first, then fill): <code>int[] a = new int[3]; a[0] = 7;</code></li></ul>`],
["Ch 8","Memory and methods",`<ul><li><b>Primitive array</b> holds the actual values in contiguous memory.</li><li><b>Object array</b> holds references; the objects live in the heap. <code>new Student[5]</code> creates 5 empty slots (null), you must create each Student.</li><li><b>Stack</b>: method calls, local variables, references. <b>Heap</b>: objects made with <code>new</code>.</li></ul>`+P(`static int sum(int[] arr) {
    int t = 0;
    for (int n : arr) t += n;
    return t;
}
static int[] m1() { return new int[]{1, 2, 3}; }`)]];

const C=[
{n:"Snack Shop menu",p:`Menu-driven program for a snack shop. Show: 1 Burger P80, 2 Fries P90, 3 Salad P110, 4 Soda P75, 5 Sandwich P60 (the slide lists Sandwich as the 5th item, but choice 5 must quit). Use Scanner for input 1-5. Use a switch: choices 1-4 print the item name and price; 5 prints "Thank you! Visit again!" and stops; anything else prints "Invalid options, enter again" and asks again.`,k:[["Scanner",/Scanner/],["switch statement",/switch\s*\(/],["case 5 exit",/case\s+5/],["default for invalid",/default\s*:/],["repeats (loop)",/\b(do|while|for)\b/],["invalid message",/Invalid options, enter again/]],s:`import java.util.Scanner;
public class Shop {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);
        int ch;
        do {
            System.out.println("1 Burger 2 Fries 3 Salad 4 Soda 5 Exit");
            ch = sc.nextInt();
            switch (ch) {
                case 1: System.out.println("Burger - P80.00"); break;
                case 2: System.out.println("Fries - P90.00"); break;
                case 3: System.out.println("Salad - P110.00"); break;
                case 4: System.out.println("Soda - P75.00"); break;
                case 5: System.out.println("Thank you! Visit again!"); break;
                default: System.out.println("Invalid options, enter again");
            }
        } while (ch != 5);
    }
}`},
{n:"Multiplication table",p:`Ask the user for a number with Scanner. Use a for loop to print its multiplication table from 1 to 10, e.g. for 5: "5 x 1 = 5", "5 x 2 = 10", ... "5 x 10 = 50". (The slide sample shows wrong products like 5 x 3 = 10; the correct value is 15.) Then trace i, the condition i <= 10 and the output for each pass.`,k:[["Scanner",/Scanner/],["for loop",/for\s*\(/],["condition i <= 10",/<=\s*10|<\s*11/],["multiplies",/\*/],["prints x and =",/" x "|"x"|" = "/]],s:`Scanner sc = new Scanner(System.in);
int n = sc.nextInt();
for (int i = 1; i <= 10; i++) {
    System.out.println(n + " x " + i + " = " + (n * i));
}`},
{n:"Number guessing (do-while)",p:`A secret number is fixed in the program (e.g. 7). Use a do-while loop to ask the user for guesses. Print "Too low" or "Too high" for wrong guesses, and "Correct! You guessed the number." when right, then stop.`,k:[["Scanner",/Scanner/],["do-while",/do\s*\{[\s\S]*\}\s*while/],["Too low",/Too low/],["Too high",/Too high/],["Correct message",/Correct! You guessed the number\./]],s:`Scanner sc = new Scanner(System.in);

do {

{n:"Running total until 0",p:`Use a while loop and Scanner to read numbers continuously and keep adding them. Stop only when the user enters 0, then print the total sum of all numbers entered.`,k:[["Scanner",/Scanner/],["while loop",/while\s*\(/],["stops at 0",/!=\s*0|==\s*0/],["running total",/\+=|=\s*\w+\s*\+/],["prints total",/println|print\(/]],s:`Scanner sc = new Scanner(System.in);

{n:"Array sum and return",p:`Write a method int sum(int[] arr) that returns the sum of all elements, and a method int[] makeArray() that returns {1, 2, 3}. In main, print sum(makeArray()). Do not hardcode the array length in sum.`,k:[["int[] parameter",/int\s*\[\]\s*\w+\s*\)/],["returns int[]",/int\s*\[\]\s+\w+\s*\(/],["uses arr.length",/\.length/],["return statement",/return\s/],["loop",/\bfor\b/]],s:`public static int sum(int[] arr) {
